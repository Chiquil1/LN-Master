name: Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test environment
        run: pnpm generate:env:debug

      - name: Check Expo dependency compatibility
        run: pnpm exec expo install --check

      - name: Check TypeScript
        run: pnpm type-check

      - name: Check ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run database tests
        run: pnpm exec jest --selectProjects db --ci --runInBand

      - name: Run React Native tests
        run: pnpm exec jest --selectProjects rn --ci --runInBand

  build-android:
    name: Build Android prerelease
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release environment
        run: >
          pnpm generate:env:release
          --
          --myanimelist-client-id "${{ vars.MYANIMELIST_CLIENT_ID }}"
          --anilist-client-id "${{ vars.ANILIST_CLIENT_ID }}"

      - name: Build Android prerelease
        uses: callstackincubator/android@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          variant: preRelease
          re-sign: true
          validate-elf-alignment: true
